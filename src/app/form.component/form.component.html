

<div class="flex h-screen bg-gray-50 overflow-hidden">

  <!-- ========== SIDEBAR ========== -->
  <aside class="w-14 bg-[#1e1b4b] flex flex-col items-center py-3 gap-1 shrink-0">
    <!-- Logo -->
    <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center mb-2">
      <svg viewBox="0 0 24 24" class="w-5 h-5 fill-white"><circle cx="12" cy="12" r="10"/><path fill="#1e1b4b" d="M8 12h8M12 8v8"/></svg>
    </div>
    <!-- Avatar utilisateur -->
    <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-gray-600 mb-1">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="user" class="w-full h-full object-cover"/>
    </div>
    <!-- Nav items -->
    <nav class="flex flex-col items-center gap-1 mt-1">
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>
      <!-- ACTIVE -->
      <button class="w-9 h-9 rounded-lg flex items-center justify-center bg-blue-600 text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="23" y2="17"/><line x1="20" y1="14" x2="26" y2="14"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      </button>
    </nav>
    <div class="flex-1"></div>
    <!-- Bottom icons -->
    <div class="flex flex-col items-center gap-1 mb-2">
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </button>
      <button class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- ========== MAIN ========== -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- TOPBAR -->
    <header class="h-12 bg-white border-b border-gray-200 flex items-center px-4 gap-3 shrink-0">
      <!-- Search -->
      <div class="flex items-center gap-2 bg-gray-100 rounded-full px-3 py-1.5 w-44">
        <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search" class="bg-transparent text-xs text-gray-500 w-full outline-none placeholder-gray-400"/>
      </div>
      <div class="flex-1"></div>
      <!-- Right icons -->
      <div class="flex items-center gap-2">
        <button class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
        </button>
        <button class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        </button>
        <button class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </button>
        <button class="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <!-- User -->
        <div class="flex items-center gap-2 ml-1">
          <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Rufin Padal" class="w-7 h-7 rounded-full object-cover"/>
          <div class="flex flex-col leading-none">
            <span class="text-xs font-semibold text-blue-600">Rufin Padal</span>
            <span class="text-[10px] text-gray-400">Admin</span>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 bg-gray-50">

      <!-- Breadcrumb -->
      <div class="flex items-center gap-1 text-xs text-gray-400 mb-3">
        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        <span>Home</span>
        <span class="text-gray-300">›</span>
        <span class="text-blue-600 font-medium">Add Staff</span>
      </div>

      <!-- FORM CARD -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">

        <!-- Section label -->
        <div class="mb-4 border-b border-gray-100 pb-2">
          <span class="text-sm font-semibold text-blue-600 border-b-2 border-blue-600 pb-2">Information personnel</span>
        </div>

        <!-- GRID 4 colonnes -->
        <form [formGroup]="staffForm" (ngSubmit)="onSubmit()" class="grid grid-cols-4 gap-x-4 gap-y-3">

          <!-- Nom -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Nom <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input formControlName="nom" type="text" placeholder="Entrer votre nom" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Prenom -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Prenom <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input formControlName="prenom" type="text" placeholder="Entrer votre prenom" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Age -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Age <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
              <input formControlName="age" type="number" placeholder="Entrer votre age" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Genre -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Genre <span class="text-red-500">*</span></label>
            <div class="flex items-center gap-4 py-2">
              <label class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer">
                <input formControlName="genre" type="radio" value="Masculin" class="accent-blue-600 w-3.5 h-3.5"/> Masculin
              </label>
              <label class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer">
                <input formControlName="genre" type="radio" value="Féminin" class="accent-blue-600 w-3.5 h-3.5"/> Feminin
              </label>
            </div>
          </div>

          <!-- Date de naissance -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Date de naissance</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <input formControlName="dateNaissance" type="date" class="text-xs text-gray-600 w-full outline-none"/>
            </div>
          </div>

          <!-- Email -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Email <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input formControlName="email" type="email" placeholder="Entrer votre email" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Telephone -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Telephone <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.77 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input formControlName="telephone" type="tel" placeholder="Entrer votre numero mobile" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Etat Matrimoniale -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Etat Matrimoniale <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              <input formControlName="etatMatrimoniale" type="text" placeholder="Entrer votre statut matrimoniale" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Qualification -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Qualification</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input formControlName="qualification" type="text" placeholder="Entrer votre qualification" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Designation -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Designation</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
              <input formControlName="designation" type="text" placeholder="Entrer votre designation" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Blood Group -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Blood Group <span class="text-red-500">*</span></label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C6 2 2 10 2 14a10 10 0 0 0 20 0c0-4-4-12-10-12z"/></svg>
              <input formControlName="bloodGroup" type="text" placeholder="Entrer votre groupe sanguin" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Addresse -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Addresse</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><path d="M3 14h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M14 14h7v7h-7z"/></svg>
              <input formControlName="adresse" type="text" placeholder="Entrer votre addresse" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Pays -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Pays</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              <input formControlName="pays" type="text" placeholder="Entrer votre pays" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Region -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Region</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <input formControlName="region" type="text" placeholder="Entrer votre region" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Ville -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Ville</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <input formControlName="ville" type="text" placeholder="Entrer votre ville" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- Code Postal -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-medium text-gray-600">Code Postal</label>
            <div class="flex items-center border border-gray-200 rounded-lg px-2.5 py-2 gap-2 focus-within:border-blue-400 bg-white">
              <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <input formControlName="codePostal" type="text" placeholder="Entrer votre code postal" class="text-xs text-gray-600 w-full outline-none placeholder-gray-300"/>
            </div>
          </div>

          <!-- BOUTONS — toute la largeur -->
          <div class="col-span-4 flex justify-end gap-3 mt-2 pt-3 border-t border-gray-100">
            <button type="button" (click)="onReset()"
              class="px-5 py-2 text-xs border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">
              Search
            </button>
            <button type="submit"
              class="px-5 py-2 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
              {{ isLoading ? 'Création...' : 'Create new staff' }}
            </button>
          </div>

        </form>
      </div>
    </main>
  </div>
</div>
